name: 验证并部署 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    name: 验证静态代码
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: JavaScript 语法检查
        run: |
          for file in dist/*.js; do
            node --check "$file"
          done
      - name: 鱼群游动回归测试
        run: npm test
      - name: 上传静态站点
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: 发布 GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布站点
        id: deployment
        uses: actions/deploy-pages@v4
